name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Сборка идёт на нашей машине, а не на серверах GitHub
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Версия Python
        run: python3 --version

      - name: Установка зависимостей
        run: python3 -m pip install -r requirements.txt

      - name: Тесты
        run: python3 -m pytest -v

      - name: Демо - проект действительно запускается
        run: python3 -m vinovatornik "в меня врезался грузовик"
